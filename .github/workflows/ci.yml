name: CI

permissions:
   contents: read

on:
   push:
      branches:
         - master
   pull_request:
      branches:
         - master

concurrency:
   group: ci-${{ github.workflow }}-${{ github.ref }}
   cancel-in-progress: true

jobs:
   test:
      name: Build & Test
      runs-on: macos-15
      steps:
         - uses: actions/checkout@v4
           with:
            persist-credentials: false

         # Pin the image's default Xcode: its iOS simulators (and the iPhone 16
         # destination below) are always installed. On macos-15, latest-stable
         # (Xcode 26.3) currently sees no iOS simulator at all.
         - name: Select Xcode
           uses: maxim-lobanov/setup-xcode@v1
           with:
            xcode-version: "16.4"

         - name: Show environment
           run: |
            xcodebuild -version
            swift --version

         - name: Build & test
           run: |
            set -o pipefail
            # Pipe through xcbeautify when it's available, but fall back to raw
            # xcodebuild output so CI keeps working if a runner image drops it.
            if command -v xcbeautify >/dev/null 2>&1; then
               FORMATTER="xcbeautify"
            else
               FORMATTER="cat"
            fi
            # Build at the package's declared minimum (iOS 17) so CI catches
            # any use of newer APIs that lacks an availability guard. Do NOT
            # override IPHONEOS_DEPLOYMENT_TARGET here — that masks such breaks.
            # Mantis-Package runs both MantisTests and MantisCoreTests.
            xcodebuild test \
               -scheme Mantis-Package \
               -destination "platform=iOS Simulator,name=iPhone 16" \
               -skipPackagePluginValidation \
               CODE_SIGNING_ALLOWED=NO \
               | "$FORMATTER"
           env:
            NSUnbufferedIO: YES

   oldest-xcode:
      name: Build (oldest supported Xcode)
      # The README promises Xcode 16.0+, and a newer toolchain can hide a break
      # such as an SDK annotation the old one lacks.
      # Build only: the test jobs run the suites.
      runs-on: macos-15
      steps:
         - uses: actions/checkout@v4
           with:
            persist-credentials: false

         - name: Select Xcode
           uses: maxim-lobanov/setup-xcode@v1
           with:
            xcode-version: "16.0"

         - name: Build package and tests
           run: |
            xcodebuild -version
            # Mantis-Package covers both libraries and both test targets.
            xcodebuild build-for-testing \
               -quiet \
               -scheme Mantis-Package \
               -destination "generic/platform=iOS Simulator" \
               CODE_SIGNING_ALLOWED=NO
            xcodebuild build-for-testing \
               -quiet \
               -scheme MantisCore \
               -destination "platform=macOS" \
               CODE_SIGNING_ALLOWED=NO

   core-macos:
      name: MantisCore on macOS
      runs-on: macos-15
      steps:
         - uses: actions/checkout@v4
           with:
            persist-credentials: false

         - name: Select Xcode
           uses: maxim-lobanov/setup-xcode@v1
           with:
            xcode-version: latest-stable

         # The Mantis UI target needs UIKit, so `swift test` (which builds every
         # target) cannot run on macOS. The shared MantisCore scheme builds and
         # tests only the UIKit-free core.
         - name: Build & test
           run: |
            set -o pipefail
            if command -v xcbeautify >/dev/null 2>&1; then
               FORMATTER="xcbeautify"
            else
               FORMATTER="cat"
            fi
            xcodebuild test \
               -scheme MantisCore \
               -destination "platform=macOS" \
               -skipPackagePluginValidation \
               CODE_SIGNING_ALLOWED=NO \
               | "$FORMATTER"
           env:
            NSUnbufferedIO: YES

   swiftlint:
      name: SwiftLint
      # Run inside the official SwiftLint image on Linux: no install step and
      # no macOS minutes. Linting only parses source, so it needs no Xcode SDK.
      runs-on: ubuntu-latest
      container: ghcr.io/realm/swiftlint:0.63.3
      steps:
         - uses: actions/checkout@v4
           with:
            persist-credentials: false

         # Warnings surface as PR annotations; only errors fail the job.
         - name: Run SwiftLint
           run: swiftlint lint --reporter github-actions-logging
