name: release-please
on:
   push:
      branches:
         - master
jobs:
   release-please:
      runs-on: ubuntu-latest
      steps:
         - uses: GoogleCloudPlatform/release-please-action@v2
           id: release
           with:
            token: ${{ secrets.GITHUB_TOKEN }}
            release-type: simple
            version-file: "./version.txt"
            package-name: release-please-action
            default-branch: master

         # Tags created with GITHUB_TOKEN never trigger other workflows, so the
         # sources-only mirror has to be dispatched explicitly.
         - name: Mirror the release to Mantis-spm
           if: ${{ steps.release.outputs.release_created }}
           env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            TAG: ${{ steps.release.outputs.tag_name }}
           run: gh workflow run mirror-spm.yml --ref master -f "tag=$TAG"
